[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympytex"
description = "Embed sympy symbolic computation into LaTeX documents"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.9"
authors = [{name = "Tim Molteno", email = "tim@physics.otago.ac.nz"}]
keywords = ["latex", "sympy", "symbolic-math", "typesetting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["sympy>=1.1"]
dynamic = ["version"]

[project.optional-dependencies]
plots = ["matplotlib"]

[project.scripts]
sympytex = "sympytex.cli:main"

[project.urls]
Homepage = "https://github.com/tmolteno/SympyTeX"
Documentation = "https://github.com/tmolteno/SympyTeX#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sympytex = ["data/*.sty"]

[tool.setuptools.dynamic]
version = {attr = "sympytex.__version__"}
